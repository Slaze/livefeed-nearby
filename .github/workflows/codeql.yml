# CodeQL code scanning.
#
# Java/Kotlin runs with `build-mode: manual`. CodeQL's `none` mode extracts Java sources only: this app is
# all Kotlin, so `none` found nothing to analyse and every java-kotlin run failed. The Kotlin extractor
# needs the Kotlin compiler to run, so the job compiles the Kotlin/JVM code with Gradle and nothing else:
# main code of both flavours (`github` debug, `fdroid` release, which also covers the debug/release source
# sets), unit tests and instrumented tests. No APK is assembled and no CMake/NDK task runs, so the native
# toolchain and the downloaded libaom/libopus sources are not needed. The build uses JDK 21 from the runner
# image and the Android SDK preinstalled on it, and keeps the Gradle wrapper checksum, dependency
# verification and lockfiles in force. The Kotlin compiler runs in-process and without the Gradle daemon or
# build cache so the CodeQL tracer sees every compilation.
# Consequence: the C/C++ native code (libaom/libopus bridge) is NOT analysed. Python (host tools) is
# scanned with `none` mode.
# If a repository-level "default setup" for code scanning is ever enabled, disable it first: the two
# configurations conflict.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write  # upload results
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile the Kotlin code (no native build)
        if: matrix.build-mode == 'manual'
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --stacktrace \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:compileGithubDebugUnitTestKotlin \
            :app:compileGithubDebugAndroidTestKotlin \
            :app:compileFdroidReleaseKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
